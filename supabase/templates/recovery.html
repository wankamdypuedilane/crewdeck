<h2>Reset your CrewDeck password</h2>
<p>Someone asked to reset the password for this account. If it was you, choose a new password:</p>
<p>
  <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery&next=/update-password">
    Choose a new password
  </a>
</p>
<p>This link expires in one hour. If you did not ask for it, ignore this e-mail: your password stays the same.</p>
